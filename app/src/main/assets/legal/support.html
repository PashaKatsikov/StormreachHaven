<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — Stormreach Haven</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #071525;
      color: #eef4ff;
    }
    .support-container {
      max-width: 420px;
      margin: 0 auto;
      background: #10233f;
      border: 1px solid #d4ad4d;
      border-radius: 18px;
      padding: 28px 22px 22px;
    }
    .support-title {
      font-size: 1.45em;
      color: #f3d27a;
      margin-bottom: 8px;
      text-align: center;
    }
    .support-desc, .source {
      color: #9fb6d4;
      font-size: .95em;
      margin-bottom: 18px;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #f3d27a;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #3d628f;
      border-radius: 8px;
      font-size: 1em;
      background: #0a1a30;
      color: #eef4ff;
    }
    .support-btn {
      width: 100%;
      background: linear-gradient(180deg, #e3ac3b 0%, #8a5b12 100%);
      color: #fff;
      border: 1px solid #ffe6a6;
      border-radius: 10px;
      padding: 12px;
      font-size: 1.05em;
      cursor: pointer;
      font-weight: 700;
    }
    .support-success {
      display: none;
      color: #2e9b4e;
      background: #10281a;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="support-container">
    <div class="support-title">Support for Stormreach Haven</div>
    <div class="source">https://stormreachhaven.store/support.html</div>
    <div class="support-desc">Please fill out the form below to ask a question or submit a request.</div>
    <form id="supportForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="Your email">
      <label for="question">Question</label>
      <textarea id="question" name="question" rows="4" required placeholder="Describe your question..."></textarea>
      <button type="submit" class="support-btn">Send</button>
    </form>
    <div class="support-success" id="supportSuccess">Your request has been sent!</div>
  </div>
  <script>
    document.getElementById("supportForm").addEventListener("submit", function(e) {
      e.preventDefault();
      var email = document.getElementById("email").value;
      var question = document.getElementById("question").value;
      var subject = encodeURIComponent("Stormreach Haven support");
      var body = encodeURIComponent("From: " + email + "\n\n" + question);
      window.location.href = "mailto:support@stormreachhaven.store?subject=" + subject + "&body=" + body;
      document.getElementById("supportSuccess").style.display = "block";
      document.getElementById("supportForm").reset();
    });
  </script>
</body>
</html>
